<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Smart Attendance - Mot de passe oublié</title>
	<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
	<link rel="icon" href="assets/favicon/favicon.ico">
	<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
	<link rel="manifest" href="assets/favicon/site.webmanifest">
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="tailwind.config.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="scripts/shared/supabase.js" defer></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<script src="scripts/shared/footer.js" defer></script>
	<script src="scripts/shared/theme.js" defer></script>
	<script src="scripts/forgottenpassword.js" defer></script>
	<link rel="stylesheet" href="styles/theme.css">
</head>

<body
	class="bg-canvas text-content-primary font-sans min-h-screen flex items-center justify-center p-4">
	<main class="bg-[#202020] w-full max-w-md p-8 rounded-2xl shadow-2xl border border-zinc-800">
		<div class="flex items-center gap-3 mb-6">
			<img src="assets/favicon/android-chrome-512x512.png" alt="Logo Smart Attendance"
				class="w-12 h-12 rounded-xl object-contain shadow-md shrink-0">
			<div>
				<h1 class="text-xl font-bold tracking-tight">Smart Attendance</h1>
				<p class="text-xs text-brand font-medium">Récupération du compte</p>
			</div>
		</div>
		<h2 class="text-lg font-bold mb-2">Mot de passe oublié</h2>
		<p class="text-sm text-zinc-400 leading-relaxed mb-6">Saisissez votre adresse e-mail pour recevoir un nouveau
			mot de passe à 4 chiffres.</p>
		<form id="forgot-password-form" class="space-y-4">
			<label for="forgot-email" class="block text-xs font-bold uppercase tracking-wider text-zinc-400">Adresse
				e-mail</label>
			<input id="forgot-email" type="email" required autocomplete="email" placeholder="vous@exemple.com"
				class="w-full px-4 py-3 bg-[#191919] border border-zinc-800 rounded-xl text-sm text-gray-200 outline-none focus:border-brand">
			<button id="forgot-password-button" type="submit"
				class="w-full py-3 bg-brand hover:bg-brand-hover text-white rounded-xl font-semibold text-sm transition-all">
				<i class="fa-solid fa-key mr-2"></i>Réinitialiser
			</button>
			<p id="forgot-password-message" class="hidden text-xs font-semibold text-center"></p>
		</form>
		<a href="login.html"
			class="block w-full text-center py-3 mt-4 border border-zinc-700 text-zinc-300 hover:text-white rounded-xl font-semibold text-sm transition-all"><i
				class="fa-solid fa-arrow-left mr-2"></i>Retour à la connexion</a>
	</main>
</body>

</html>
